  - generic [ref=e943]:
    - 'heading "Bare Sudoku: ücretsiz online sudoku, reklamsız, üyeliksiz" [level=1] [ref=e944]'
    - paragraph [ref=e945]: "Bare Sudoku tarayıcıda çalışan ücretsiz bir sudoku oyunudur. Reklam yok, hesap yok, takip yok, kurulum yok: sayfayı aç, seviye seç, oyna. Her bulmacanın tek çözümü vardır ve yalnızca mantıkla çözülür; her ipucu gerekçesini açıklar. Oyun internetsiz çalışır ve MIT lisansıyla açık kaynaktır."
    - heading "Neler var" [level=2] [ref=e946]
    - list [ref=e947]:
      - listitem [ref=e948]: "Dört seviye: Kolay, Orta, Zor ve Uzman"
      - listitem [ref=e949]: Her bulmacanın tek çözümü var, tahmin gerekmez
      - listitem [ref=e950]: Not, geri al, sil ve tek dokunuşla tüm notları doldur
      - listitem [ref=e951]: "Tekniği açıklayan ipucu: tek aday, kilitli adaylar, çift ve üçlü, X-Wing, Y-Wing, Swordfish ve XYZ-Wing"
      - listitem [ref=e952]: Satır, sütun, kutu ve aynı rakam vurgusu; kapatılabilir hata işareti
      - listitem [ref=e953]: Otomatik kayıt, koyu tema, klavye desteği ve yatay düzen
      - listitem [ref=e954]: İlk ziyaretten sonra internetsiz çalışır, mağaza gerekmez
      - listitem [ref=e955]: 37 dil, her biri kendi sayfasında
    - heading "Android uygulaması" [level=2] [ref=e956]
    - paragraph [ref=e957]:
      - text: "Bare Sudoku'nun yerel bir Android uygulaması da var: sürüm 1.4, yaklaşık 25 KB, izin yok, internet erişimi yok, sıfır kütüphaneyle düz Java. Google Play'de değil; imzalı APK'yı GitHub Releases'ten indirip Android 8 ve üstüne kurabilirsin."
      - link "APK'yı indir" [ref=e958] [cursor=pointer]:
