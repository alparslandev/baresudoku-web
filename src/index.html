<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="author" content="Alparslan Selçuk Develioğlu">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{URL}}">
{{ALTERNATES}}
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="license" href="https://github.com/alparslandev/baresudoku-web/blob/main/LICENSE">
<link rel="author" href="https://devdiscipline.com/about">
<link rel="me" href="https://github.com/alparslandev">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bare Sudoku">
<meta property="og:locale" content="{{OG_LOCALE}}">
{{OG_ALTERNATES}}
<meta property="og:url" content="{{URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://baresudoku.com/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="https://baresudoku.com/og.png">
<meta name="twitter:image:alt" content="{{OG_ALT}}">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
{{CSS}}
</style>
</head>
<body>
<main id="app">
<header id="top">
<span id="level"></span>
<span id="time"></span>
<button id="menu-btn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<div id="board" role="grid" aria-label="Sudoku"></div>
<div id="msg" aria-live="polite"></div>
<div id="tools">
<button type="button" data-act="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-6l-6 6 6 6"/></svg><span></span></button>
<button type="button" data-act="erase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l5 5-9 9H7l-3-3 11-11zM8 12l4 4"/></svg><span></span></button>
<button type="button" data-act="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3"/></svg><span></span></button>
<button type="button" data-act="fill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h.01M12 6h.01M18 6h.01M6 12h.01M12 12h.01M18 12h.01M6 18h.01M12 18h.01M18 18h.01" stroke-width="3.5"/></svg><span></span></button>
<button type="button" data-act="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-3.5 10.9c.7.5 1 1.3 1 2.1h5c0-.8.3-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span></span></button>
</div>
<div id="keys"></div>
<footer id="foot"><a id="android" href="https://github.com/alparslandev/baresudoku/releases/latest/download/baresudoku.apk"></a> · <a id="source" href="https://github.com/alparslandev/baresudoku-web"></a></footer>
</main>
{{CONTENT}}
<div id="overlay" hidden>
<div id="panel" role="dialog" aria-modal="true">
<h2 id="panel-title"></h2>
<p id="panel-sub"></p>
<button type="button" data-level="0"></button>
<button type="button" data-level="1"></button>
<button type="button" data-level="2"></button>
<button type="button" data-level="3"></button>
<button type="button" id="errors-btn"></button>
<label><span id="lang-label"></span><select id="lang"></select></label>
<button type="button" id="cancel-btn"></button>
</div>
</div>
<noscript><p style="text-align:center;padding:24px">Bare Sudoku needs JavaScript to run.</p></noscript>
<script>
{{SCRIPT}}
</script>
</body>
</html>
